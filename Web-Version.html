<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>🎓 Student Management System</h1>
    <p>Manage • Organize • Track</p>
</header>

<nav>
    <a href="#dashboard">Dashboard</a>
    <a href="#add">Add Student</a>
    <a href="#students">Students</a>
</nav>

<main>

    <section id="dashboard" class="dashboard">

        <div class="card">
            <h2 id="totalStudents">0</h2>
            <p>Total Students</p>
        </div>

        <div class="card">
            <h2 id="totalDepartments">0</h2>
            <p>Departments</p>
        </div>

        <div class="card">
            <h2 id="averageAge">0</h2>
            <p>Average Age</p>
        </div>

    </section>


    <section id="add" class="container">

        <h2>Add Student</h2>

        <form id="studentForm">

            <input
                type="number"
                id="studentId"
                placeholder="Student ID"
                required
            >

            <input
                type="text"
                id="studentName"
                placeholder="Student Name"
                required
            >

            <input
                type="number"
                id="studentAge"
                placeholder="Age"
                required
            >

            <input
                type="text"
                id="department"
                placeholder="Department"
                required
            >

            <button type="submit">
                Add Student
            </button>

        </form>

    </section>


    <section id="students" class="container">

        <h2>Student Records</h2>

        <input
            type="text"
            id="search"
            placeholder="🔍 Search by name or ID..."
        >

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody id="studentTable">
            </tbody>

        </table>

    </section>

</main>

<script src="js/script.js"></script>

</body>
</html>
